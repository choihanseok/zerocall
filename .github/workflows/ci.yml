name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build --wheel
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: zerocall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d zerocall_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZC_POSTGRES_TEST_URL: postgresql+psycopg://fixture:disposable-ci-only@127.0.0.1:5432/zerocall_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q tests/test_postgresql.py
      - run: docker build -t zerocall-ci .
      - name: Container startup and health
        run: |
          docker run -d --name zerocall-ci --network host \
            -e ZC_ENVIRONMENT=TEST -e ZC_DATABASE_URL="$ZC_POSTGRES_TEST_URL" zerocall-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          exit 1
